[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "motor_controller_model"
version = "0.1.0"
description = "Motor controller model package"
authors = [
    { name = "Renan O. Shimoura" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "pyyaml",
    "pydantic>=2.0",
    "h5py",
    "structlog",
]

[project.optional-dependencies]
standalone = [
    "nestml",
    "minjerk-dynamics @ git+https://github.com/near-nes/controller.git#subdirectory=complete_control/shared/minjerk",
]
notebook = ["jupyterlab"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
