        - {init_angle_deg: 90.0, target_angle_deg: 138.0}
        - {init_angle_deg: 90.0, target_angle_deg: 18.0}
        - {init_angle_deg: 90.0, target_angle_deg: 140.0}
        - {init_angle_deg: 90.0, target_angle_deg: 20.0}
        - {init_angle_deg: 90.0, target_angle_deg: 142.0}
        - {init_angle_deg: 90.0, target_angle_deg: 22.0}

        - {init_angle_deg: 92.0, target_angle_deg: 138.0}
