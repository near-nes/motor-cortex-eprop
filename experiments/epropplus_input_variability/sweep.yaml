      training.sampling.strategy: uniform
      training.trajectories: *trajectories_2deg

  - name: variability_2deg_shuffled_epochs
    overrides:
      task.n_iter: 500
      plotting.spikes_plot_n_sequences: 6
      training.sampling.strategy: shuffled_epochs
      training.trajectories: *trajectories_2deg


