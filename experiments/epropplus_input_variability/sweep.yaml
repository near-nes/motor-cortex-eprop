        - {init_angle_deg: 90.0, target_angle_deg: 140.0}
        - {init_angle_deg: 90.0, target_angle_deg: 20.0}
        - {init_angle_deg: 90.0, target_angle_deg: 145.0}
        - {init_angle_deg: 90.0, target_angle_deg: 25.0}

        - {init_angle_deg: 95.0, target_angle_deg: 135.0}
        - {init_angle_deg: 95.0, target_angle_deg: 15.0}
        - {init_angle_deg: 95.0, target_angle_deg: 140.0}
        - {init_angle_deg: 95.0, target_angle_deg: 20.0}
        - {init_angle_deg: 95.0, target_angle_deg: 145.0}
        - {init_angle_deg: 95.0, target_angle_deg: 25.0}

  - name: variability_5deg_uniform
    overrides:
      task.n_iter: 500
